[package]
name = "oxjson"
version = "0.1.0"
edition = "2021"
description = "Standalone demo: schema reference + interactive JSON-body builder over an OpenAPI spec."

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
schema-doc = { path = "../../schema-doc" }
schema-tui = { path = "../../schema-tui" }
schemars = "0.8.22"
serde_json = "1.0"
